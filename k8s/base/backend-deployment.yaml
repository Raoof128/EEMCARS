apiVersion: apps/v1
kind: Deployment
metadata:
  name: eemcars-backend
  namespace: eemcars
  labels:
    app: eemcars
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eemcars
      component: backend
  template:
    metadata:
      labels:
        app: eemcars
        component: backend
    spec:
      containers:
      - name: backend
        image: eemcarsprodacr.azurecr.io/eemcars-backend:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: eemcars-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: eemcars-config
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: eemcars-secrets
              key: secret-key
        - name: AZURE_KEYVAULT_URL
          valueFrom:
            configMapKeyRef:
              name: eemcars-config
              key: keyvault-url
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: eemcars-backend
  namespace: eemcars
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: eemcars
    component: backend
