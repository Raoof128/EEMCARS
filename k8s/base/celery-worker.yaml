apiVersion: apps/v1
kind: Deployment
metadata:
  name: eemcars-celery-worker
  namespace: eemcars
  labels:
    app: eemcars
    component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eemcars
      component: celery-worker
  template:
    metadata:
      labels:
        app: eemcars
        component: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: eemcarsprodacr.azurecr.io/eemcars-backend:latest
        command: ["celery"]
        args: ["-A", "app.core.celery", "worker", "--loglevel=info"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: eemcars-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: eemcars-config
              key: redis-url
        - name: CELERY_BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: eemcars-config
              key: celery-broker-url
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eemcars-celery-beat
  namespace: eemcars
  labels:
    app: eemcars
    component: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eemcars
      component: celery-beat
  template:
    metadata:
      labels:
        app: eemcars
        component: celery-beat
    spec:
      containers:
      - name: celery-beat
        image: eemcarsprodacr.azurecr.io/eemcars-backend:latest
        command: ["celery"]
        args: ["-A", "app.core.celery", "beat", "--loglevel=info"]
        env:
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: eemcars-config
              key: redis-url
        - name: CELERY_BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: eemcars-config
              key: celery-broker-url
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
