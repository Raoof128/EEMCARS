apiVersion: apps/v1
kind: Deployment
metadata:
  name: eemcars-frontend
  namespace: eemcars
  labels:
    app: eemcars
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eemcars
      component: frontend
  template:
    metadata:
      labels:
        app: eemcars
        component: frontend
    spec:
      containers:
      - name: frontend
        image: eemcarsprodacr.azurecr.io/eemcars-frontend:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: REACT_APP_API_URL
          valueFrom:
            configMapKeyRef:
              name: eemcars-config
              key: api-url
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: eemcars-frontend
  namespace: eemcars
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: eemcars
    component: frontend
