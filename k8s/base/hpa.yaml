apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eemcars-backend-hpa
  namespace: eemcars
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eemcars-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eemcars-frontend-hpa
  namespace: eemcars
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eemcars-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
