apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: eemcars
data:
  fluent.conf: |
    # Input from container logs
    <source>
      @type tail
      @id in_tail_container_logs
      path /var/log/containers/eemcars-*.log
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type json
        time_format %Y-%m-%dT%H:%M:%S.%NZ
      </parse>
    </source>

    # Add Kubernetes metadata
    <filter kubernetes.**>
      @type kubernetes_metadata
      @id filter_kube_metadata
      kubernetes_url "#{ENV['FLUENT_FILTER_KUBERNETES_URL'] || 'https://' + ENV.fetch('KUBERNETES_SERVICE_HOST') + ':' + ENV.fetch('KUBERNETES_SERVICE_PORT') + '/api'}"
      verify_ssl "#{ENV['KUBERNETES_VERIFY_SSL'] || true}"
      ca_file "#{ENV['KUBERNETES_CA_FILE']}"
    </filter>

    # Parse JSON application logs
    <filter kubernetes.var.log.containers.eemcars-backend**>
      @type parser
      key_name log
      reserve_data true
      <parse>
        @type json
      </parse>
    </filter>

    # Add Essential Eight context
    <filter kubernetes.var.log.containers.eemcars-**>
      @type record_transformer
      <record>
        app_name eemcars
        environment production
        region australiaeast
        compliance essential_eight
      </record>
    </filter>

    # Filter sensitive data
    <filter kubernetes.**>
      @type grep
      <exclude>
        key log
        pattern /(password|secret|token|api_key)=/i
      </exclude>
    </filter>

    # Output to Azure Log Analytics
    <match kubernetes.var.log.containers.eemcars-**>
      @type azure-loganalytics
      @id out_azure_loganalytics
      customer_id "#{ENV['AZURE_LOG_ANALYTICS_WORKSPACE_ID']}"
      shared_key "#{ENV['AZURE_LOG_ANALYTICS_SHARED_KEY']}"
      log_type EEMCARSLogs
      add_time_field true
      time_field_name timestamp
      localtime false
      <buffer>
        @type file
        path /var/log/fluentd-buffers/azure-loganalytics.buffer
        flush_mode interval
        flush_interval 30s
        flush_at_shutdown true
        retry_type exponential_backoff
        retry_wait 10s
        retry_max_interval 300s
        retry_timeout 1h
        overflow_action block
      </buffer>
    </match>

    # Output to stdout for debugging
    <match kubernetes.var.log.containers.eemcars-**>
      @type stdout
      @id out_stdout
    </match>
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: eemcars
  labels:
    app: fluentd
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      serviceAccountName: fluentd
      containers:
      - name: fluentd
        image: fluent/fluentd-kubernetes-daemonset:v1-debian-azureloganalytics
        env:
        - name: FLUENT_UID
          value: "0"
        - name: AZURE_LOG_ANALYTICS_WORKSPACE_ID
          valueFrom:
            secretKeyRef:
              name: eemcars-secrets
              key: log-analytics-workspace-id
        - name: AZURE_LOG_ANALYTICS_SHARED_KEY
          valueFrom:
            secretKeyRef:
              name: eemcars-secrets
              key: log-analytics-shared-key
        resources:
          limits:
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 200Mi
        volumeMounts:
        - name: config
          mountPath: /fluentd/etc/fluent.conf
          subPath: fluent.conf
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: fluentd-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: eemcars
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - namespaces
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd
subjects:
- kind: ServiceAccount
  name: fluentd
  namespace: eemcars
